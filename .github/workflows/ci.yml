# SPORTiX CI.
#
# Runs every gate that guards this codebase. The static gates need no
# credentials, so they run on every push; the live smoke test needs a real
# Appwrite project and runs only when the secret is present — a fork's pull
# request cannot run it, and it must not fail the build for that reason.
name: CI
  
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # `tsc --noEmit` on its own resolves tsconfig.json, which declares no files
      # and only project references, so it checks nothing and exits 0. This runs
      # the referenced projects.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --max-warnings 200

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npx vite build

      # The key that used to be compiled into the bundle. Assert it is gone rather
      # than trusting that it stays gone.
      - name: No AI key in the bundle
        run: |
          if grep -rqE 'AIza[A-Za-z0-9_-]{20,}' dist/; then
            echo "::error::A Google API key was found in the built bundle."
            exit 1
          fi
          echo "No API key found in dist/."

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sportix-backend
    # Settings() requires these three, and importing any gate imports config. They
    # are placeholders: the static gates never open a connection, and the test suite
    # intercepts Appwrite at the transport layer. Locally these come from
    # sportix-backend/.env, which is why the gates passed here and failed in CI.
    env:
      APPWRITE_PROJECT_ID: ci-placeholder-project
      APPWRITE_API_KEY: ci-placeholder-key
      SECRET_KEY: ci-not-a-real-secret-key-value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sportix-backend/requirements.txt
      - run: pip install -r requirements.txt

      # These five need no credentials: they read the code and scripts/schema.py.
      - name: Schema self-check and declared resources
        run: python -c "import scripts.schema as s; print(f'{len(s.COLLECTIONS)} collections declared')"

      - name: Attribute keys and enum values
        run: python -m scripts.check_attribute_keys

      - name: Service references and call signatures
        run: python -m scripts.check_service_refs

      - name: Request models against columns
        run: python -m scripts.check_schema_alignment

      - name: No query-string payloads on write routes
        run: python -m scripts.check_request_bodies

      - name: Tests
        run: python -m pytest -q

  live:
    name: Live smoke
    runs-on: ubuntu-latest
    # Only on the main branch of this repository, and only when a project is
    # configured. It creates and deletes real accounts, so it must not run from a
    # fork or on every branch.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: sportix-backend
    env:
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sportix-backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Schema matches the live project
        if: env.APPWRITE_API_KEY != ''
        run: python -m scripts.verify_schema

      - name: End-to-end smoke
        if: env.APPWRITE_API_KEY != ''
        run: python -m scripts.smoke
