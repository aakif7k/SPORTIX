[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    # The Appwrite SDK marks the Databases service deprecated in favour of
    # TablesDB. That migration is tracked separately (see app/core/appwrite.py);
    # until then the notice fires on every call and drowns the output.
    ignore:Call to deprecated function.*:DeprecationWarning
