    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SportiX",
      "url": "https://sportix.io",
      "description": "Next-Generation AI Sports Intelligence, Squad Matchmaking and Athlete Performance Platform",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Early Theme & Motion Initialization Script (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('sportix-theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!isDark) {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
          }
          var reduceMotion = localStorage.getItem('sportix-reduce-motion') === 'true';
          if (reduceMotion) {
            document.documentElement.setAttribute('data-reduce-motion', 'true');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
